# Downloads the browser may save. '#' starts a comment.
#
# One rule per line:
#   type <mime>       allow this Content-Type
#   ext <extension>   allow this URL or Content-Disposition extension
#
# Anything not listed is blocked. An empty file blocks every download.
# Restart doorman-browser after editing.

# Extensions currently allowed.
ext .iso
ext .tar.zst
ext .appimage
ext .crx
